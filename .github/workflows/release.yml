name: Release Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release Backend & Frontend
    runs-on: ubuntu-latest
    
    steps:
      # ---------------------------------------
      # CHECKOUT
      # ---------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------
      # SETUP .NET 10
      # ---------------------------------------
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Backend
        run: dotnet restore backend

      - name: Build Backend
        run: dotnet build backend --no-restore

      - name: Test Backend
        run: dotnet test tests/backend --no-build --verbosity normal

      # ---------------------------------------
      # SETUP NODE for Frontend + semantic-release
      # ---------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install root dependencies (semantic-release)
        run: npm install

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      # ---------------------------------------
      # RUN semantic-release
      # ---------------------------------------
      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Get release version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || true)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # If no version created, stop job
      - name: Stop if no new release
        if: env.VERSION == ''
        run: |
          echo "No new release — skipping Docker build"
          exit 0

      # ---------------------------------------
      # LOGIN TO DOCKER HUB
      # ---------------------------------------
      - name: Login to DockerHub
        if: env.VERSION != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---------------------------------------
      # BACKEND DOCKER BUILD + PUSH
      # ---------------------------------------
      - name: Build Backend Image
        if: env.VERSION != ''
        run: |
          docker build \
            -f Dockerfile.backend \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/ops-backend:${VERSION} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/ops-backend:latest \
            .

      - name: Push Backend Images
        if: env.VERSION != ''
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ops-backend:${VERSION}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ops-backend:latest

      # ---------------------------------------
      # FRONTEND DOCKER BUILD + PUSH
      # ---------------------------------------
      - name: Build Frontend Image
        if: env.VERSION != ''
        run: |
          docker build \
            -f Dockerfile.frontend \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/ops-frontend:${VERSION} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/ops-frontend:latest \
            frontend

      - name: Push Frontend Images
        if: env.VERSION != ''
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ops-frontend:${VERSION}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ops-frontend:latest
